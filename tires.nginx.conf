server {
    listen 80;
    listen [::]:80;
    server_name tires.ktra-pro.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tires.ktra-pro.tech;

    root /var/www/ktraautopart;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/tires.ktra-pro.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tires.ktra-pro.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security: block hidden files (.git, .gitignore, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static assets: 30-day cache
    location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.md$ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json;
}
